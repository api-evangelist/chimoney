specification: API Commons Rate Limits
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/RateLimits
provider: Chimoney
providerId: chimoney
created: '2026-07-12'
modified: '2026-07-12'
reconciled: false
tags:
- Payouts
- Disbursements
- Rate Limiting
- Quotas
description: >-
  Chimoney does not publish fixed numeric API rate limits in its public
  documentation as of the review date. In practice, throughput is governed less
  by a per-minute request cap and more by your funded wallet balance and by
  compliance / verification status on your account: payouts can only be issued
  up to available balance, and production access requires KYB verification.
  Clients should implement retries with exponential backoff and honor standard
  HTTP throttling responses.
notes: >-
  No documented per-account or per-endpoint request-rate numbers were available
  at the review date. Verify any applicable limits with Chimoney during
  reconciliation. Because this is a money-movement API, expect additional
  server-side controls (velocity checks, per-transaction and per-day value
  limits tied to verification tier) beyond simple request rate limits.
sources:
- https://chimoney.readme.io/reference/authentication
- https://chimoney.readme.io/reference/getting-started-with-your-api
- https://chimoney.io/developers-api/
responseCodes:
  throttled: 429
limits:
- name: API Requests
  scope: account
  metric: requests
  limit: not published
  notes: No fixed numeric request-rate limit is documented for the Chimoney API.
- name: Payout Value
  scope: account
  metric: value
  limit: bounded by funded wallet balance and verification tier
  notes: Payouts cannot exceed available wallet balance; value ceilings depend on KYB/compliance status.
policies:
- name: Backoff Strategy
  description: Clients should implement exponential backoff with jitter and honor Retry-After on 429 responses.
- name: Idempotency
  description: Use transaction references (chiRef / reference fields) and status checks to avoid duplicate payouts on retry.
maintainers:
- FN: Kin Lane
  email: kin@apievangelist.com
