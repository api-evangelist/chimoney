publisherName: Chimoney
serviceCategory: Payments and Money Movement
billingModel:
  pricingCategory: Usage-Based
  billingFrequency: Per-Transaction
  billingCurrency: USD
  chargeCategories:
  - Usage
  - Purchase
focusColumns:
  ServiceName: Chimoney Payouts
  ServiceCategory: Payments and Money Movement
  ProviderName: Chimoney
  PublisherName: Chimoney
  InvoiceIssuerName: Chimoney
