description: >-
  FinOps view of Chimoney spend. Chimoney is a transaction-priced global payouts
  platform - there is no published subscription fee for API access itself.
  Spend is dominated by (1) the value of funds you disburse, (2) per-payout fees
  that vary by rail (bank, mobile money, airtime, gift card, Chimoney wallet,
  Interledger) and destination country, and (3) FX spread on cross-currency
  payouts. Wallet-to-wallet Chimoney transfers are the cheapest path; external
  rails carry a fee. Because the platform moves real money, cost governance
  overlaps with treasury and reconciliation: funded wallet balances, per-rail
  fees, and FX all need tracking.
notes: >-
  Per-transaction rates and FX spread are not published and not reconciled here;
  confirm with Chimoney. Fees for a specific payout can be estimated at request
  time via the Info exchange-rate / conversion endpoints and transfer quotes,
  which is the practical hook for cost visibility and allocation.
