meters:
- name: payout_fee
  description: Per-payout fee charged per transaction, varying by rail and destination country.
  unit: transactions
  aggregation: sum
  dimensions:
  - subAccount
  - rail
  - country
- name: disbursed_value
  description: Face value of funds paid out to beneficiaries, drawn from the funded wallet balance.
  unit: currency
  aggregation: sum
  dimensions:
  - subAccount
  - currency
- name: fx_spread
  description: Currency-conversion spread applied on cross-currency payouts.
  unit: currency
  aggregation: sum
  dimensions:
  - sourceCurrency
  - targetCurrency
principles:
- name: Visibility
  description: Track disbursed value, per-rail payout fees, and FX spread per sub-account and destination country; reconcile against wallet funding.
- name: Allocation
  description: Use sub-accounts and transaction references to map payout costs to teams, campaigns, or customers.
- name: Optimization
  description: Prefer wallet-to-wallet Chimoney transfers where possible, batch payouts, and choose the cheapest viable rail per country; quote FX before sending.
- name: Accountability
  description: Assign owners per sub-account; review monthly disbursed value and fees against budget and funded balance.
