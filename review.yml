  modeledNotConfirmed:
    - note: |
        Request-body schemas in openapi/chimoney-openapi.yml are representative
        and simplified for the most common endpoints (payouts, wallets,
        multicurrency, sub-accounts, redeem, payments); the full field set is
        larger. Endpoint paths, methods, tags, and summaries are grounded
        verbatim in the live spec. The OpenAPI is a curated subset (52 of 59
        operations); omitted operations include the AI invoice generator,
        additional Info lookups (bank-search, country-states-regions,
        bill-merchants, fee-estimate, identification-types,
        beneficiary-rules), community update/verify-code, spei/interledger
        variants, and multicurrency bank-account/request issuance.
    - note: |
        Pricing (per-payout fees, FX spread) is modeled honestly and NOT
        reconciled - Chimoney publishes no numeric API price table; see
        plans/ and finops/ with reconciled:false.
sources:
  - url: https://api.chimoney.io/v0.2/swagger.json
    type: OpenAPI
    note: Live OpenAPI 3.0.0 spec (version 0.2.2), 59 paths. securitySchemes.apiKeyAuth = apiKey in header X-API-KEY. servers = https://api.chimoney.io/ (prod) and https://api-v2-sandbox.chimoney.io (sandbox). All operations are HTTPS REST.
  - url: https://api.chimoney.io/v0.2/api-docs/
    type: APIReference
    note: Swagger UI for the v0.2 API. All documented operations are HTTPS REST.
  - url: https://chimoney.readme.io/reference/authentication
    type: Documentation
    note: API key from dash.chimoney.io/developers; no WebSocket mentioned.
  - url: https://chimoney.readme.io/reference/webhooks-and-events
    type: Documentation
    note: Webhooks configured in the dashboard, POST JSON event payloads. Outbound HTTP, not WebSocket.
  - url: https://chimoney.io/developers-api/
    type: Documentation
    note: Product overview - global payouts, agent/multicurrency wallets, campaigns. GitHub org github.com/Chimoney, LinkedIn linkedin.com/company/chimoney.
actions:
  asyncapiPath: null
  apisYmlUpdated: true
  reason: |
    No WebSocket (or SSE) protocol surface exists on Chimoney's own API. The
    API is request/response REST over HTTPS; asynchronous delivery is via
    dashboard-configured outbound webhooks. No AsyncAPI document was created
    because there is no server-push streaming transport with a documented
    schema on Chimoney's own API to model.
