aid: chimoney
name: Chimoney
review:
  question: Does Chimoney expose a documented public WebSocket API?
  answer: false
  date: '2026-07-12'
  reviewer: API Evangelist
  asyncapiSpecCreated: false
  asyncapiScopeNote: |
    No AsyncAPI document was authored. Chimoney's public API surface is
    request/response REST over HTTPS. Its only server-push mechanism is
    outbound webhooks (Chimoney POSTs JSON events to an endpoint URL you
    configure in the dashboard) - there is no bidirectional or streaming
    transport on Chimoney's own API to model, and webhooks are configured in
    the dashboard rather than exposed as an API resource with a documented
    schema. No SSE or WebSocket surface is documented.
findings:
  summary: |
    Chimoney does not publish a documented public WebSocket API. Chimoney is a
    developer-first global payouts / disbursement platform. Its API (v0.2,
    OpenAPI 3.0.0 spec version 0.2.2) is pure REST over HTTPS, served from
    https://api.chimoney.io (production) and https://api-v2-sandbox.chimoney.io
    (sandbox), with paths under /v0.2/. Authentication is an API key passed in
    the X-API-KEY header, issued self-serve from the developer dashboard
    (https://dash.chimoney.io/developers). Asynchronous notification is handled
    by outbound webhooks configured in the dashboard (Developers -> App WebHooks
    -> Endpoints), which POST JSON event payloads (e.g. payout.bank.completed,
    payout.gift-card.failed, chimoney.payment.completed) to your server. No
    realtime, bidirectional, or streaming WebSocket (ws:// or wss://) endpoint,
    and no Server-Sent Events surface, is documented anywhere in Chimoney's API
    reference as of the review date.
  transports:
    - protocol: REST
      scheme: https
      baseURL: https://api.chimoney.io/v0.2
      documented: true
      note: Full API surface (Payouts, Wallets, MultiCurrency Wallets, Sub-Accounts, Redeem, Info, Accounts, Payments). Sandbox host is https://api-v2-sandbox.chimoney.io.
    - protocol: Webhook
      scheme: https
      documented: true
      note: Outbound event notifications POSTed to a dashboard-configured endpoint URL. Server-to-endpoint HTTP, not WebSocket. No documented signature-verification header at review date.
    - protocol: WebSocket
      scheme: wss
      documented: false
      note: No WebSocket endpoint is documented in Chimoney's API reference or dashboard as of the review date.
  authentication:
    scheme: apiKey
    in: header
    parameterName: X-API-KEY
    note: Key issued from https://dash.chimoney.io/developers. Separate sandbox key/host for testing; production access after KYB verification.
