  /v0.2.4/sub-account/onboarding/send-otp:
    post:
      summary: Send an OTP before a sub-account exists (pre-signup onboarding)
      tags:
      - Sub Account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - channel
              - owner
              properties:
                channel:
                  type: string
                  enum:
                  - phone
                  - email
                  description: Delivery channel for the OTP.
                  example: phone
                owner:
                  type: string
                  description: Destination phone number (international format) or email address.
                  example: '+447441408666'
                phoneChannel:
                  type: string
                  enum:
                  - sms
                  - whatsapp
                  description: Overrides the SMS-first default for phone OTPs. Only relevant when channel is "phone".
                  example: sms
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  message:
                    type: string
                    example: OTP sent successfully.
                  data:
                    type: object
                    properties:
                      uid:
                        type: string
                        example: x6YlKJaoqmkZCJzhf40s
                      owner:
                        type: string
                        example: '+447441408666'
                      channel:
                        type: string
                        example: phone
        '400':
          description: Error.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: error
                  error:
                    type: string
                    example: channel and owner are required.
      operationId: postV024SubAccountOnboardingSendOtp
      x-operation-id-source: derived
