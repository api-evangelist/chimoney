              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: error
                  error:
                    type: string
                    example: Resource Not Found
                  code:
                    type: string
                    example: SUBACCOUNT_NOT_FOUND
                  message:
                    type: string
                    example: Account with id 7fQ5Rrtl4iL1gmONEE5m not found
        '500':
          $ref: '#/components/responses/ServerError'
      operationId: postV024SubAccountCommunityUpdate
      x-operation-id-source: derived
  /v0.2.4/sub-account/community/members:
    get:
      summary: Get community members
      tags:
      - Sub Account
      parameters:
      - in: query
        name: communityID
        schema:
          type: integer
        description: Community ID
        example: 1
      - in: query
        name: limit
        schema:
          type: integer
        description: maximum number of users to return - default is 50
        example: 50
      - in: query
        name: startAfterId
        schema:
          type: string
        description: ID of the last User Data retrieved - important for retrieivng subsequent pages
      - in: query
        name: startBeforeId
        schema:
          type: string
        description: ID of the first User Data retrieved - important for retrieivng previous pages
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  message:
                    type: string
                    example: Community members retrieved successfully
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        parent:
                          type: string
                          example: qP3P6bjbjLZUMxVfxgEqzOF0hNM2
                        feePercent:
                          type: number
                          example: 0
                        accountSecondCurrencies:
                          type: array
                          items:
                            type: string
                          example: []
                        verified:
                          type: boolean
                          example: true
                        subscription:
                          type: object
                          properties:
                            subscription_end_timestamp:
                              type: object
                              properties:
                                _seconds:
                                  type: number
                                  example: 1878974727
                                _nanoseconds:
                                  type: number
                                  example: 543000000
                            subscription_start_timestamp:
                              type: object
                              properties:
                                _seconds:
                                  type: number
                                  example: 1721208327
                                _nanoseconds:
                                  type: number
                                  example: 543000000
                            id:
                              type: string
                              example: partner-white-glove
                        isScrimUser:
                          type: boolean
                          example: false
                        subAccount:
                          type: boolean
                          example: true
                        preferredExchangeRate:
                          type: boolean
                          example: false
                        uid:
                          type: string
                          example: 1f8581c9-98f4-49a0-82f9-2a27fb27bbf5
                        approved:
                          type: boolean
                          example: true
                        createdDate:
                          type: string
                          example: '2024-07-17T09:25:27.543Z'
                        joinDate:
                          type: string
                          example: '2024-07-17T09:25:27.543Z'
                        meta:
                          type: object
                          example: {}
                        approvals:
                          type: array
                          items:
                            type: object
