  /v0.2.4/sub-account/community/create:
    post:
      summary: Create a sub-account community associated with a user
      tags:
      - Sub Account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: string
                  description: SubAccount ID.
                  example: 8b8522d0-fe5f-4813-a5cf-e45e8be10905
                community:
                  type: object
                  description: Community payload.
                  properties:
                    communityID:
                      type: integer
                      example: 1
                    name:
                      type: string
                      example: Test Community
                    membershipID:
                      type: string
                      example: '23232323'
                    memberName:
                      type: string
                      example: Test Test Chimoney
                    voucherCode:
                      type:
                      - string
                      - 'null'
                      example: null
                    communityType:
                      type: string
                      example: paid
                  required:
                  - communityID
                  - name
                  - membershipID
                  - memberName
                  - communityType
              required:
              - id
              - community
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  message:
                    type: string
                    example: SubAccount added to 'Chimoney Community!' successfully
                  data:
                    type: object
                    example: {}
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'
      operationId: postV024SubAccountCommunityCreate
      x-operation-id-source: derived
