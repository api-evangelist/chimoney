openapi: 3.2.0
info:
  title: Chimoney API Docs Sub Account API
  version: 0.2.4
  description: This is the latest version of the Chimoney API. For deprecated version routes, please refer to /v0.2/api-docs.
servers:
- url: https://api.chimoney.io/
  description: Prod Server
- url: https://api-v2-sandbox.chimoney.io
  description: Sandbox API v2 (v0.2.4)
security:
- apiKeyAuth: []
tags:
- name: Sub Account
  description: All sub-account related endpoints.
paths:
  /v0.2.4/sub-account/create:
    post:
      description: Production KYC follows organization settings and ignores requireKyc or requireKYC when supplied. In sandbox only, false skips KYC for this test account; omitted follows organization policy.
      summary: Create a new sub-account
      tags:
      - Sub Account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: Name of owner of Wallet.
                  example: Mide Jones
                email:
                  type: string
                  description: Email of owner of Wallet.
                  example: user@mail.com
                firstName:
                  type: string
                  description: First Name of owner.
                  example: Mide
                lastName:
                  type: string
                  description: Last Name of owner.
                  example: Jones
                phoneNumber:
                  type: string
                  description: Phone Number with country code starting with a +.
                  example: '+16471234567'
                requireKyc:
                  type: boolean
                  description: In production this deprecated input is ignored. In sandbox, false skips KYC for this account and true requires KYC. Omit to follow organization policy. Cannot be combined with requireKYC in sandbox.
                requireKYC:
                  type: boolean
                  description: Legacy spelling of requireKyc. Ignored in production; uses the same override rules in sandbox. Send at most one spelling in sandbox.
                country:
                  type: object
                  description: Optional declared legal residence used for product capability resolution before KYC.
                  required:
                  - code
                  - name
                  properties:
                    code:
                      type: string
                      minLength: 2
                      maxLength: 2
                      example: GB
                    name:
                      type: string
                      example: United Kingdom
                meta:
                  type: object
                  description: Metadata to store about the account.
              required:
              - name
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  message:
                    type: string
                    description: Message indicating the result of the operation.
                    example: Sub-account created successfully
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                        description: Unique identifier for the created sub-account.
                        example: 907b90ef-d723-4b07-9f74-480afb5f09ef
                      lastName:
                        type: string
                        description: Last name of the sub-account owner.
                        example: Okeeke
                      parent:
                        type: string
                        description: Parent account ID.
                        example: qP3P6bjbjLZUMxVfxgEqzOF0hNM2
                      feePercent:
                        type: number
                        description: Fee percentage for the sub-account.
                        example: 0
                      accountSecondCurrencies:
                        type: array
                        description: List of secondary currencies associated with the account.
                        items:
                          type: string
                      verified:
                        type: boolean
                        description: Whether the sub-account is verified.
                        example: true
                      subscription:
                        type: object
                        properties:
                          subscription_end_timestamp:
                            type: object
                            properties:
                              _seconds:
                                type: integer
                                example: 1883676344
                              _nanoseconds:
                                type: integer
                                example: 773000000
                          subscription_start_timestamp:
                            type: object
                            properties:
                              _seconds:
                                type: integer
                                example: 1725909944
                              _nanoseconds:
                                type: integer
                                example: 773000000
                          id:
                            type: string
                            example: partner-white-glove
                      isScrimUser:
                        type: boolean
                        example: false
                      subAccount:
                        type: boolean
                        example: true
                      firstName:
                        type: string
                        example: Madueke
                      preferredExchangeRate:
                        type: boolean
                        example: false
                      uid:
                        type: string
                        example: 907b90ef-d723-4b07-9f74-480afb5f09ef
                      approved:
                        type: boolean
                        example: true
                      createdDate:
                        type: string
                        example: '2024-09-09T19:25:44.773Z'
                      joinDate:
                        type: string
                        example: '2024-09-09T19:25:44.773Z'
                      phoneNumber:
                        type: string
                        example: '+2348139955333'
                      tier:
                        type: object
                        properties:
                          id:
                            type: string
                            example: tier-3
                      meta:
                        type: object
                        properties:
                          email:
                            type: string
                            example: Okyson@mail.com
                      approvals:
                        type: array
                        items:
                          type: object
                          properties:
                            changedFields:
                              type: array
                              items:
                                type: string
                              example:
                              - all
                            deviceTime:
                              type: string
                              example: 9/9/2024
                            timestamp:
                              type: string
                              example: '2024-09-09T19:25:33.918Z'
                      name:
                        type: string
                        example: Madueke Okeeke
                      apiUseEnabled:
                        type: boolean
                        example: true
                      email:
                        type: string
                        example: Okyson@mail.com
                      p_id:
                        type: number
                        example: 60250680
                      verification:
                        type: object
                        properties:
                          status:
                            type: string
                            example: completed
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'
      operationId: postV024SubAccountCreate
      x-operation-id-source: derived
  /v0.2.4/sub-account/update:
    post:
      summary: Update a sub-account
      tags:
      - Sub Account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: string
                  description: Sub Account ID.
                  example: 3c7b4a2a-dc67-439e-bde1-f5b30fb36bb7
                meta:
                  type: object
                  description: meta to store any number of user information.
                firstName:
                  type: string
                  description: First Name of user.
                  example: Mide
                lastName:
                  type: string
                  description: Last Name of user.
                  example: Jones
                phoneNumber:
                  type: string
                  description: Phone Number with country code starting with a +.
                  example: '+16471234567'
                country:
                  type: object
                  description: Declared legal residence. Cannot conflict with provider-verified KYC.
                  required:
                  - code
                  - name
                  properties:
                    code:
                      type: string
                      minLength: 2
                      maxLength: 2
                      example: GB
                    name:
                      type: string
                      example: United Kingdom
              required:
              - id
              - meta
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  message:
                    type: string
                    description: A message indicating that the sub-account has been updated.
                    example: Sub-account updated successfully
                  data:
                    type: object
                    properties:
                      _writeTime:
                        type: object
                        description: The timestamp indicating when the update occurred.
                        properties:
                          _seconds:
                            type: integer
                            description: The seconds part of the timestamp.
                            example: 1725912009
                          _nanoseconds:
                            type: integer
                            description: The nanoseconds part of the timestamp.
                            example: 13040000
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'
      operationId: postV024SubAccountUpdate
      x-operation-id-source: derived
  /v0.2.4/sub-account/delete:
    delete:
      summary: Delete an existing sub-account
      description: Sandbox permits deleting owned accounts including verified and KYC-exempt accounts. Delete child accounts first. The deleted ID stays reserved to protect transaction history; the email can be reused with a new ID. Production retains its restriction on deleting accounts with verification data.
      tags:
      - Sub Account
      parameters:
      - in: query
        name: id
        schema:
          type: string
        description: Sub account ID.
        required: true
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  message:
                    type: string
                    description: A message indicating that the sub-account has been updated.
                    example: Sub-account deleted successfully
                  data:
                    type: object
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Resource not found.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: error
                  type:
                    type: string
                    example: Resource Not Found
                  code:
                    type: string
                    example: SUBACCOUNT_NOT_FOUND
                  message:
                    type: string
                    example: Account with id 7fQ5Rrtl4iL1gmONEE5m not found
        '500':
          $ref: '#/components/responses/ServerError'
      operationId: deleteV024SubAccountDelete
      x-operation-id-source: derived
  /v0.2.4/sub-account/get:
    get:
      summary: Get details of an existing sub account
      description: Returns fresh account state, wallets, and verificationProgress using the Account Verification page's section visibility and order, derived from the active verification's pinned KYC requirements and current account state. Address review is nested within the address section. No new verification or provider session is created by this read.
      tags:
      - Sub Account
      parameters:
      - in: query
        name: id
        schema:
          type: string
        description: Sub account ID.
        required: true
      - in: query
        name: communityID
        schema:
          type: string
        description: Community ID.
        required: false
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  message:
                    type: string
                    example: Sub-account details fetched successfully
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                        example: 907b90ef-d723-4b07-9f74-480afb5f09ef
                      verificationProgress:
                        $ref: '#/components/schemas/SubAccountVerificationProgress'
                      lastName:
                        type: string
                        example: Okeeke
                      parent:
                        type: string
                        example: qP3P6bjbjLZUMxVfxgEqzOF0hNM2
                      feePercent:
                        type: integer
                        example: 0
                      accountSecondCurrencies:
                        type: array
                        items:
                          type: string
                        example: []
                      verified:
                        type: boolean
                        example: true
                      subscription:
                        type: object
                        properties:
                          subscription_end_timestamp:
                            type: object
                            properties:
                              _seconds:
                                type: integer
                                example: 1883676344
                              _nanoseconds:
                                type: integer
                                example: 773000000
                          subscription_start_timestamp:
                            type: object
                            properties:
                              _seconds:
                                type: integer
                                example: 1725909944
                              _nanoseconds:
                                type: integer
                                example: 773000000
                          id:
                            type: string
                            example: partner-white-glove
                      firstName:
                        type: string
                        example: Madueke
                      phoneNumber:
                        type: string
                        example: '+2348139955333'
                      tier:
                        type: object
                        properties:
                          id:
                            type: string
                            example: tier-3
                      wallets:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: string
                              example: kmgq3kE1nUN5krrR3RcV
                            owner:
                              type: string
                              example: 907b90ef-d723-4b07-9f74-480afb5f09ef
                            balance:
                              type: integer
                              example: 1000
                            type:
                              type: string
                              example: momo
                            transactions:
                              type: array
                              items:
                                type: object
                                properties:
                                  amount:
                                    type: integer
                                    example: 0
                                  balanceBefore:
                                    type: integer
                                    example: 1000
                                  meta:
                                    type: object
                                    properties:
                                      date:
                                        type: object
                                        properties:
                                          _seconds:
                                            type: integer
                                            example: 1725909944
                                          _nanoseconds:
                                            type: integer
                                            example: 768000000
                                  newBalance:
                                    type: integer
                                    example: 1000
                                  description:
                                    type: string
                                    example: new wallet creation transaction
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Resource not found.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: error
                  type:
                    type: string
                    example: Resource Not Found
                  code:
                    type: string
                    example: SUBACCOUNT_NOT_FOUND
                  message:
                    type: string
                    example: Account with id 7fQ5Rrtl4iL1gmONEE5m not found
        '500':
          $ref: '#/components/responses/ServerError'
      operationId: getV024SubAccountGet
      x-operation-id-source: derived
  /v0.2.4/sub-account/get-by-email:
    get:
      summary: Look up a sub-account by email, scoped to the caller's organization
      tags:
      - Sub Account
      parameters:
      - in: query
        name: email
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Sub-account found.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
