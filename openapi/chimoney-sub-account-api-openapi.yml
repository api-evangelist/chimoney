components:
  schemas:
    ValidationError:
      type: object
      properties:
        status:
          type: string
          description: Status of the validation error.
          example: error
        type:
          type: string
          description: Type of validation error.
          example: Validation Error
        code:
          type: string
          description: Error code indicating validation issue.
          example: INVALID_REQUEST
        message:
          type: string
          description: Detailed validation error message.
          example: The request parameters are invalid.
    SubAccountKYCInitiationResponse:
      type: object
      properties:
        status:
          type: string
          example: success
        message:
          type: string
          example: Verification initialized successfully
        data:
          type: object
          properties:
            kycUrl:
              type: string
              format: uri
              description: URL to open for the end user
              example: https://dash.chimoney.io/verify/kyc/907b90ef-d723-4b07-9f74-480afb5f09ef
            formUrl:
              type: string
              format: uri
              deprecated: true
              description: Legacy alias of kycUrl for existing integrations
              example: https://dash.chimoney.io/verify/kyc/907b90ef-d723-4b07-9f74-480afb5f09ef
            verificationId:
              type: string
              description: Verification ID
              example: verif_123456789
            subAccountID:
              type: string
              description: Sub-account ID
              example: 907b90ef-d723-4b07-9f74-480afb5f09ef
            kycStatus:
              type: string
              description: Current account verification status
              example: pending
            verificationStatus:
              type: string
              description: Current verification session status
              example: pending
            redirectUrl:
              type:
              - string
              - 'null'
              format: uri
              description: Return URL supplied at initiation, or null when omitted
              example: https://example.com/kyc-complete
    Forbidden:
      type: object
      properties:
        status:
          type: string
          description: Status of the response.
          example: error
        error:
          type: string
          description: Error message indicating forbidden access.
          example: API Access not enabled for account Test. Email support@chimoney.io
    Unauthorized:
      type: object
      properties:
        status:
          type: string
          description: Status of the response.
          example: error
        error:
          type: string
          description: Error message indicating unauthorized access.
          example: API key is not defined. Generate a new one from the developer portal.
    SubAccountVerificationProgress:
      type: object
      required:
      - verificationId
      - requirementsStatus
      - requirements
      - status
      - canTransact
      - progress
      - currentStep
      - nextAction
      - steps
      - updatedAt
      properties:
        verificationId:
          type:
          - string
          - 'null'
        requirementsStatus:
          type: string
          enum:
          - pinned
          - not_initialized
          - not_pinned
          - unavailable
          - exempt
          - not_required
          description: Pinned uses the active verification policy. Exempt means organization KYC exemption; not_required means an explicit sandbox bypass. Both have an empty checklist.
        requirements:
          type:
          - object
          - 'null'
          properties:
            version:
              type:
              - string
              - 'null'
            country:
              type:
              - string
              - 'null'
            profile:
              type:
              - string
              - 'null'
            task:
              type:
              - string
              - 'null'
        status:
          $ref: '#/components/schemas/SubAccountVerificationStepStatus'
        canTransact:
          type: boolean
          description: Account approval and KYC compliance gate snapshot. Individual transactions remain subject to their own authorization, limits and screening.
        progress:
          type: object
          required:
          - completedSteps
          - requiredSteps
          properties:
            completedSteps:
              type: integer
              minimum: 0
            requiredSteps:
              type: integer
              minimum: 0
          description: Counts visible required Account Verification sections. Excludes hidden, optional and skipped sections; completion count alone does not authorize an account.
        currentStep:
          type:
          - string
          - 'null'
        nextAction:
          type:
          - object
          - 'null'
          properties:
            step:
              type:
              - string
              - 'null'
            type:
              type: string
              enum:
              - submit
              - start
              - resume
              - retry
              - upload
            label:
              type: string
          description: Next available user action. Use POST /v0.2.4/sub-account/kyc/initiate with subAccountID to open the hosted flow; refresh get-subaccount after returning. Action availability is advisory and mutation endpoints revalidate access.
        steps:
          type: array
          items:
            type: object
            required:
            - key
            - label
            - required
            - status
            - completedAt
            - action
            - details
            properties:
              key:
                type: string
                example: identity_liveness
                description: Stable step key. Clients should tolerate unknown future keys.
              label:
                type: string
              required:
                type: boolean
              status:
                $ref: '#/components/schemas/SubAccountVerificationStepStatus'
              completedAt:
                type:
                - string
                - 'null'
                format: date-time
                description: Null when no completion timestamp was recorded.
              action:
                type: object
                properties:
                  type:
                    type: string
                    enum:
                    - none
                    - submit
                    - start
                    - resume
                    - retry
                    - upload
                  available:
                    type: boolean
              details:
                type: object
                description: Public details vary by step; never includes tokens, raw provider results, document contents or internal review notes.
                properties:
                  missingFields:
                    type: array
                    items:
                      type: string
                  documentStatus:
                    $ref: '#/components/schemas/SubAccountVerificationStepStatus'
                  livenessStatus:
                    $ref: '#/components/schemas/SubAccountVerificationStepStatus'
                  inputValidationStatus:
                    $ref: '#/components/schemas/SubAccountVerificationStepStatus'
                  verificationRequired:
                    type: boolean
                    description: Whether the address section requires address verification.
                  verificationStatus:
                    $ref: '#/components/schemas/SubAccountVerificationStepStatus'
                  attemptsUsed:
                    type: integer
                    minimum: 0
                  attemptsRemaining:
                    type: integer
                    minimum: 0
                  canRetry:
                    type: boolean
                  initiatedAt:
                    type:
                    - string
                    - 'null'
                    format: date-time
                  expiresAt:
                    type:
                    - string
                    - 'null'
                    format: date-time
                  documents:
                    type: array
                    items:
                      type: object
                      properties:
                        documentType:
                          type: string
                        status:
                          $ref: '#/components/schemas/SubAccountVerificationStepStatus'
                  documentsComplete:
                    type: boolean
                    description: False if the bounded document summary is incomplete. Do not interpret absent document types as missing uploads in this case.
        updatedAt:
          type:
          - string
          - 'null'
          format: date-time
          description: Latest recorded timestamp among the state used to build progress, not the response generation time.
    SubAccountVerificationStepStatus:
      type: string
      enum:
      - not_started
      - pending
      - action_required
      - in_progress
      - under_review
      - completed
      - failed
      - skipped
    ServerError:
      type: object
      properties:
        status:
          type: string
          description: Status of the error.
          example: error
        type:
          type: string
          description: Type of server error.
          example: server error
        code:
          type: string
          description: Specific error code for server issues.
          example: INTERNAL_SERVER_ERROR
        message:
          type: string
          description: Detailed message explaining the issue.
          example: An internal server error occurred.
  responses:
    Forbidden:
      description: Access to this resource is forbidden.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Forbidden'
    ValidationError:
      description: Validation error in the request.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationError'
    ServerError:
      description: Indicates an internal server error.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ServerError'
    Unauthorized:
      description: Access to this resource is not available for unauthenticated users.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Unauthorized'
  securitySchemes:
    apiKeyAuth:
      type: apiKey
      in: header
      name: X-API-KEY
