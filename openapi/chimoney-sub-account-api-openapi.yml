      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: string
                  description: SubAccount ID.
                  example: 8b8522d0-fe5f-4813-a5cf-e45e8be10905
                community:
                  type: object
                  properties:
                    communityID:
                      type: integer
                      example: 1
                    membershipID:
                      type: string
                      example: '23232323'
                    memberName:
                      type: string
                      example: Test Test Chimoney
              required:
              - id
              - community
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
