  /v0.2.4/sub-account/kyc/initiate:
    post:
      summary: Start or resume KYC verification for a sub-account
      description: Creates or retrieves a verification link for a sub-account. Open the returned kycUrl for the end user, and read the sub-account profile for subsequent status updates. This POST endpoint is the canonical initiation contract; the two GET endpoints below are compatibility aliases for existing integrations.
      tags:
      - Sub Account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - subAccountID
              properties:
                subAccountID:
                  type: string
                  description: Sub-account ID
                  example: 907b90ef-d723-4b07-9f74-480afb5f09ef
                redirectUrl:
                  type: string
                  format: uri
                  description: Optional allowlisted HTTPS browser return URL after identity capture. Refresh the sub-account profile after return because final verification state is asynchronous.
                  example: https://example.com/kyc-complete
                task:
                  type: string
                  description: Optional verification action to open. Omit this field to continue the account's normal onboarding flow.
                  example: onboarding
      responses:
        '200':
          description: Verification link initialized or retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubAccountKYCInitiationResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Resource not found.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: error
                  type:
                    type: string
                    example: Resource Not Found
                  code:
                    type: string
                    example: SUBACCOUNT_NOT_FOUND
                  message:
                    type: string
                    example: Account with id 907b90ef-d723-4b07-9f74-480afb5f09ef not found
        '500':
          $ref: '#/components/responses/ServerError'
      operationId: postV024SubAccountKycInitiate
      x-operation-id-source: derived
