openapi: 3.0.3
info:
  title: Chimoney API
  description: 'Chimoney is a developer-first global payouts and disbursement platform with deep coverage
    across Africa and 130+ countries. The REST API sends money to bank accounts, mobile money wallets,
    airtime, gift cards, Chimoney wallets, and Interledger wallet addresses; manages multicurrency wallets
    and sub-accounts; supports redemption, payment collection, and informational lookups (banks, assets,
    exchange rates). All requests are authenticated with an API key passed in the X-API-KEY header, issued
    from the Chimoney developer dashboard (dash.chimoney.io/developers). A separate sandbox host is available
    for testing. This is a curated, representative subset of the live OpenAPI (source: https://api.chimoney.io/v0.2/swagger.json,
    spec version 0.2.2); paths, methods, and summaries are grounded in that document. Request-body schemas
    are representative and simplified for the most common endpoints - consult the official docs for the
    full field set.'
  version: 0.2.2
  contact:
    name: Chimoney
    url: https://chimoney.io
servers:
- url: https://api.chimoney.io
  description: Production (v0.2)
- url: https://api-v2-sandbox.chimoney.io
  description: Sandbox (v0.2)
security:
- apiKeyAuth: []
tags:
- name: Payouts
  description: Send money to banks, mobile money, airtime, gift cards, Chimoney wallets, Interac, and
    Interledger wallet addresses.
- name: Interledger
  description: ''
- name: Wallet
  description: List, look up, and transfer between Chimoney wallets.
- name: MultiCurrency Wallets
  description: Create and manage multicurrency wallets and transfer between them.
- name: SubAccount
  description: Create and manage sub-accounts (wallet accounts) and communities under your organization.
- name: Redeem
  description: Redeem issued Chimoney, airtime, gift cards, and mobile money.
- name: Info
  description: 'Reference lookups: supported banks, assets, exchange rates, currency conversion, and bank
    account verification.'
- name: Account
  description: Retrieve transactions, public profiles, transfer between accounts, and issue wallet addresses.
- name: Payments
  description: Initiate and verify inbound payment (collection) requests.
paths:
  /v0.2/payouts/bank:
    post:
      operationId: post_v0.2_payouts_bank
      tags:
      - Payouts
      summary: Payout to Bank in a supported Country.
      description: Payout to Bank in a supported Country.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                subAccount:
                  type: string
                  description: Subaccount (wallet account) to payout from, if any.
                turnOffNotification:
                  type: boolean
                  description: Disables email and other notifications from Chimoney.
                debitCurrency:
                  type: string
                  description: Wallet currency to debit from.
                  example: CAD
                banks:
                  type: array
                  description: Bank payout instructions.
                  items:
                    type: object
                    properties:
                      countryToSend:
                        type: string
                        example: Nigeria
                      account_bank:
                        type: string
                        description: Bank code.
                        example: '044'
                      account_number:
                        type: string
                        example: 0690000031
                      valueInUSD:
                        type: number
                        example: 10
                      reference:
                        type: string
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
