openapi: 3.2.0
info:
  title: Chimoney API Docs Payouts API
  version: 0.2.4
  description: This is the latest version of the Chimoney API. For deprecated version routes, please refer to /v0.2/api-docs.
servers:
- url: https://api.chimoney.io/
  description: Prod Server
- url: https://api-v2-sandbox.chimoney.io
  description: Sandbox API v2 (v0.2.4)
security:
- apiKeyAuth: []
tags:
- name: Payouts
  description: All payout operations.
paths:
  /v0.2.4/payouts/airtime:
    post:
      summary: Payout Airtime to a Phone number
      tags:
      - Payouts
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                subAccount:
                  type: string
                  description: Subaccount (Wallet Account) to payout from, if any.
                  example: '1234567'
                turnOffNotification:
                  type: boolean
                  description: disables email and other notifications from Chimoney.
                  example: 'false'
                airtimes:
                  type: array
                  description: Airtime.
                  items:
                    type: object
                    properties:
                      countryToSend:
                        type: string
                        description: Country of recipient.
                        example: Nigeria
                      phoneNumber:
                        type: string
                        description: Phone number of recipient.
                        example: '+2341000000000'
                      valueInUSD:
                        description: payout value in USD
                        example: 5
                      narration:
                        type: string
                        description: Narration/Description of payment to be included notification to user
                        example: Monthly Airtime
                      collectionPaymentIssueID:
                        type: string
                        description: issue ID for the payment payout initiated.
                        example: '1209992222'
                    required:
                    - countryToSend
                    - phoneNumber
                    - valueInUSD
              required:
              - airtimes
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    description: Status of the request.
                    example: success
                  message:
                    description: message of the request.
                    example: Airtime Payout is successfull
                  data:
                    type: object
                    properties:
                      payoutLink:
                        type: string
                        example: undefined/pay/?issueID=XQTUvRBntIU3AHgQ3jFuN9ZcHIC3_1_1661114934226
                      data:
                        type: array
                        items:
                          type: object
                      error:
                        type: string
                        example: None
                      payouts:
                        type: array
                        items:
                          type: object
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'
      operationId: postV024PayoutsAirtime
      x-operation-id-source: derived
  /v0.2.4/payouts/bank:
    post:
      summary: Payout to Bank in a supported Country
      tags:
      - Payouts
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                subAccount:
                  type: string
                  description: Subaccount (Wallet Account) to payout from, if any.
                  example: '1234567'
                turnOffNotification:
                  type: boolean
                  description: disables email and other notifications from Chimoney.
                  example: 'false'
                debitCurrency:
                  type: string
                  description: Wallet Currency to debit from.
                  example: CAD
                banks:
                  type: array
                  description: Banks.
                  items:
                    type: object
                    properties:
                      countryToSend:
                        type: string
                        description: Payout country.
                        example: Nigeria
                      account_bank:
                        type: string
                        description: Bank code.
                        example: '044'
                      account_number:
                        type: string
                        description: Recipient account number.
                        example: 0690000031
                      valueInUSD:
                        type: number
                        description: Payout value in USD.
                        example: 10
                      amount:
                        type: number
                        description: Payout amount in specified currency. Defaults to valueInUSD.
                        example: 10
                      reference:
                        type: string
                        description: Transaction reference.
                        example: '1234567890'
                      fullname:
                        type: string
                        description: Full name of beneficiary. Required for all countries except Nigeria
                        example: Jane Doe
                      branch_code:
                        type: string
                        description: branch_code from /info/bank-branches. Required for all countries except Nigeria
                        example: GH190101
                      narration:
                        type: string
                        description: Narration/Description of payment to be included notification to user
                        example: Monthly Salary Payment
                      redirect_url:
                        type: string
                        format: uri
                        description: URL to redirect the payer to after pass-through collection completes.
                        example: https://merchant.example/payment-complete
                      collectionPaymentIssueID:
                        type: string
                        description: issue ID for the payment payout initiated.
                        example: '1209992222'
                    required:
                    - countryToSend
                    - account_bank
                    - account_number
              required:
              - banks
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    description: Status of the request.
                    example: success
                  message:
                    description: message of the request.
                    example: Bank Payout is successfull
                  data:
                    type: object
                    properties:
                      chimoneys:
                        type: array
                        items:
                          type: object
                      payouts:
                        type: array
                        items:
                          type: object
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'
      operationId: postV024PayoutsBank
      x-operation-id-source: derived
  /v0.2.4/payouts/chimoney:
    post:
      summary: Payout Chimoney
      tags:
      - Payouts
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                subAccount:
                  type: string
                  description: Subaccount (Wallet Account) to payout from, if any.
                  example: '1234567'
                turnOffNotification:
                  type: boolean
                  description: disables email and other notifications from Chimoney.
                  example: 'false'
                chimoneys:
                  type: array
                  description: Chimoneys payload.
                  items:
                    type: object
                    properties:
                      email:
                        type: string
                        description: Recipient email address.
                        example: test@gmail.com
                      phone:
                        type: string
                        description: Recipient Phone Number with country code.
                        example: '+16471112222'
                      valueInUSD:
                        type: number
                        description: Amount in USD to send.
                        example: 10
                      amount:
                        type: number
                        description: Amount in specifiec currency to send. Required if currency is set
                        example: 10
                      currency:
                        type: string
                        description: ISO Currency String like CAD, USD etc
                        example: CAD
                      narration:
                        type: string
                        description: Narration/Description of payment to be included notification to user
                        example: Monthly Flex Payment
                      collectionPaymentIssueID:
                        type: string
                        description: issue ID for the payment payout initiated.
                        example: '1209992222'
                      redeemData:
                        type: object
                        properties:
                          walletID:
                            type: string
                            description: Chimoney Wallet ID to deposit the value to.
                            example: XQTUvRBntIU3AHgQ3jFuN9ZcHIC3
                          interledgerWalletAddress:
                            type: string
                            description: Interledger Wallet Address (Payment Pointer) to settle the Payment in. Must be issued by a Chimoney Interledger pair
                            example: https://ilp.chimoney.io/uchi
                          beneficiaryId:
                            type: string
                            description: Beneficiary ID of bank recipeient usually `beneID` or `beneficiaryId` - Create one here `/v0.2.4/beneficiary/bank`.
                            example: Sam-15cc11ef-b5e6-4339-9ece-9c5b0149d
                          quotePayload:
                            type: object
                            description: Includes amount, destinationCurrency, and originCurrency.
              required:
              - chimoneys
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    description: Status of the request.
                    example: success
                  message:
                    description: message of the request.
                    example: Chimoney payout completed successfully
                  data:
                    type: object
                    properties:
                      paymentLink:
                        type: string
                        example: undefined/pay/?issueID=XQTUvRBntIU3AHgQ3jFuN9ZcHIC3_2_1661118346647
                      data:
                        type: array
                        items:
                          type: object
                      chimoneys:
                        type: array
                        items:
                          type: object
                      error:
                        type: string
                        example: None
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Resource not found.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: error
                  type:
                    type: string
                    example: Resource Not Found
                  code:
                    type: string
                    example: WALLET_NOT_FOUND
                  message:
                    type: string
                    example: Could not find a ${destinationCurrency} wallet for receiver
        '500':
          $ref: '#/components/responses/ServerError'
      operationId: postV024PayoutsChimoney
      x-operation-id-source: derived
  /v0.2.4/payouts/wallet:
    post:
      summary: Payout to a Chimoney Wallet
      tags:
      - Payouts
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                subAccount:
                  type: string
                  description: Subaccount (Wallet Account) to payout from, if any.
                  example: '1234567'
                turnOffNotification:
                  type: boolean
                  description: disables email and other notifications from Chimoney.
                  example: 'false'
                wallets:
                  type: array
                  description: Wallets payload.
                  items:
                    type: object
                    properties:
                      receiver:
                        type: string
                        description: Valid Chimoney User or Organization ID.
                        example: dimfofofofoof
                      valueInUSD:
                        type: number
                        description: Value in USD.
                        example: 10
                      narration:
                        type: string
                        description: Narration/Description of payment to be included notification to user
                        example: Reward Payment
                      collectionPaymentIssueID:
                        type: string
                        description: issue ID for the payment payout initiated.
                        example: '1209992222'
                    required:
                    - valueInUSD
                    - receiver
              required:
              - wallets
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    description: Status of the request.
                    example: success
                  message:
                    description: message of the request.
                    example: Payout to Chimoney wallets completed successfully.
                  data:
                    type: object
                    properties:
                      paymentLink:
                        type: string
                        example: undefined/pay/?issueID=XQTUvRBntIU3AHgQ3jFuN9ZcHIC3_2_1661118346647
                      data:
                        type: array
                        items:
                          type: object
                      chimoneys:
                        type: array
                        items:
                          type: object
                      error:
                        type: string
                        example: None
                      payouts:
                        type: object
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Resource not found.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: error
                  type:
                    type: string
                    example: Resource Not Found
                  code:
                    type: string
                    example: WALLET_NOT_FOUND
                  message:
                    type: string
                    example: Could not find a ${destinationCurrency} wallet for receiver
        '500':
          $ref: '#/components/responses/ServerError'
      operationId: postV024PayoutsWallet
      x-operation-id-source: derived
  /v0.2.4/payouts/interledger-wallet-address:
    post:
      summary: Payout to a Interledger Wallet Address
      tags:
      - Payouts
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                subAccount:
                  type: string
                  description: Subaccount (Wallet Account) to payout from if any.
                  example: '1234567'
                turnOffNotification:
                  type: boolean
                  description: disables email and other notifications from Chimoney.
                  example: 'false'
                debitCurrency:
                  type: string
                  description: Wallet Currency to debit from to settle the amountToDeliver values.
                  example: CAD
                interledgerWallets:
                  type: array
                  description: Interledger Wallet Address payload.
                  items:
                    type: object
                    properties:
                      interledgerWalletAddress:
                        type: string
                        description: Interledger Wallet Address (Payment Pointer) to settle the Payment in. Must be issued by a Chimoney Interledger pair
                        example: https://ilp-sandbox.chimoney.com/username
                      currency:
                        type: string
                        description: Currency/ILP Asset ID to deliver to the user.
                        example: USD
                      amountToDeliver:
                        type: number
                        description: Amount to deliver to the user.
                        example: 10
                      amount:
                        type: number
                        description: DEPRECATED. Value in 'currency' to send.
                        example: 200
                      valueInUSD:
                        type: number
                        description: DEPRECATED. Value in USD to send.
                        example: 2500
                      narration:
                        type: string
                        description: Narration/Description of payment to be included notification to user
                        example: Interledger Salary Payment
                      collectionPaymentIssueID:
                        type: string
                        description: issue ID for the payment payout initiated.
                        example: '1209992222'
                    required:
                    - interledgerWalletAddress
              required:
              - interledgerWallets
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    description: Status of the request.
                    example: success
                  message:
                    type: string
                    description: Message of the request.
                    example: Payout to Chimoney wallets completed successfully.
                  data:
                    type: object
                    properties:
                      paymentLink:
                        type: string
                        example: undefined/pay/?issueID=XQTUvRBntIU3AHgQ3jFuN9ZcHIC3_2_1661118346647
                      data:
                        type: array
                        items:
                          type: object
                      chimoneys:
                        type: array
                        items:
                          type: object
                      error:
                        type: string
                        example: None
                      payouts:
                        type: object
                        properties:
                          additionalProperties:
                            type: object
                          issueID:
                            type: string
                            example: eaabe2eb-e774-4f81-8ba9-ede2ea2d0058_11_1726579317119
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'
      operationId: postV024PayoutsInterledgerWalletAddress
      x-operation-id-source: derived
  /v0.2.4/payouts/gift-card:
    post:
      summary: Payout Giftcards to an email
      tags:
      - Payouts
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                subAccount:
                  type: string
                  description: Subaccount (Wallet Account) to payout from, if any.
                  example: 000022d0-fe5f-4813-a5cf-e45e8be1111
                turnOffNotification:
                  type: boolean
                  description: disables email and other notifications from Chimoney.
                  example: 'false'
                giftcards:
                  type: array
                  description: Giftcard payload.
                  items:
                    type: object
                    properties:
                      email:
                        type: string
                        description: Recipient email address.
                        example: test@gmail.com
                      valueInUSD:
                        type: number
                        description: Value in USD.
                        example: 10
                      narration:
                        type: string
                        description: Narration/Description of payment to be included notification to user
                        example: Monthly Gift card reward
                      collectionPaymentIssueID:
                        type: string
                        description: issue ID for the payment payout initiated.
                        example: '1209992222'
                      redeemData:
                        type: object
                        description: Data needed to redeem.
                        properties:
                          productId:
                            type: string
                            description: Product ID.
                            example: 1800FL-US
                          countryCode:
                            type: string
                            description: The country code.
                            example: US
                          valueInLocalCurrency:
                            type: number
                            description: The value in local currency.
                            example: 10
                    required:
                    - email
                    - valueInUSD
              required:
              - giftcards
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    description: Status of the request.
                    example: success
                  message:
                    type: string
                    description: Message describing the outcome.
                    example: Chimoney payout to gift cards completed successfully
                  data:
                    type: object
                    properties:
                      chimoneys:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: string
                              example: voDK37Kj6g8v6OpMPolr
                            valueInUSD:
                              type: number
                              example: 10
                            chimoney:
                              type: integer
                              example: 10000
                            issueID:
                              type: string
                              example: 63576330-b5f6-4279-9324-80633ce14710_10_1726569689832
                            productId:
                              type: string
                              example: ZAPPO-US
                            personalizedMessage:
                              type: string
                              example: Monthly Gift card reward
                            fee:
                              type: number
                              example: 1
                            type:
                              type: string
                              example: giftcard
                            issuer:
                              type: string
                              example: 63576330-b5f6-4279-9324-80633ce14710
                            enabledToRedeem:
                              type: array
                              items:
                                type: string
                              example:
                              - giftcard
                            valueInLocalCurrency:
                              type: number
                              example: 10
                            t_id:
                              type: integer
                              example: 846858
                            collectionPaymentIssueID:
                              type: string
                              example: 1209992222
                            chiRef:
                              type: string
                              example: 4a3e61a3-ced8-4a48-a35d-02329ecbd2ad
                            countryCode:
                              type: string
                              example: US
                            narration:
                              type: string
                              example: Monthly Gift card reward
                            integration:
                              type: object
                              properties:
                                appID:
                                  type: string
                                  example: rCh0APD3W3V7SE4EDVn6
                            issueDate:
                              type: string
                              format: date-time
                              example: '2024-09-17T10:41:37.326Z'
                            email:
                              type: string
                              example: test@gmail.com
                            redeemData:
                              type: object
                              properties:
                                valueInLocalCurrency:
                                  type: number
                                  example: 10
                                productId:
                                  type: string
                                  example: ZAPPO-US
                                countryCode:
                                  type: string
                                  example: US
                            initiatedBy:
                              type: string
                              example: qP3P6bjbjLZUMxVfxgEqzOF0hNM2
                            status:
                              type: string
                              example: redeemed
                      payouts:
                        type: array
                        items:
                          type: object
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'
      operationId: postV024PayoutsGiftCard
      x-operation-id-source: derived
  /v0.2.4/payouts/mobile-money:
    post:
      summary: Payout Mobile Money (Momo)
      tags:
      - Payouts
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                subAccount:
                  type: string
                  description: Subaccount (Wallet Account) to payout from, if any.
                  example: '1234567'
                turnOffNotification:
                  type: boolean
                  description: disables email and other notifications from Chimoney.
                  example: 'false'
                debitCurrency:
                  type: string
                  description: Wallet currency to debit.
                momos:
                  type: array
                  description: Mobile Money.
                  items:
                    type: object
                    properties:
                      countryToSend:
                        type: string
                        description: Payout country.
                        example: Kenya
                      phoneNumber:
                        type: string
                        description: Recipient phone Number.
                        example: '254710102720'
                      valueInUSD:
                        type: number
                        description: Payout value in USD.
                        example: 10
                      reference:
                        type: string
                        description: Transaction reference.
                        example: '1234567890'
                      momoCode:
                        type: string
                        description: Mobile money code.
                        example: MPS
                      narration:
                        type: string
                        description: Narration/Description of payment to be included notification to user
                        example: Offline Mobile Money Gift
                      collectionPaymentIssueID:
                        type: string
                        description: issue ID for the payment payout initiated.
                        example: '1209992222'
                      senderIdType:
                        type: string
                        description: "The sender's ID document type\t(See Info section for Identfication Types)"
                        example: '04'
                      senderIdNumber:
                        type: string
                        description: This is the number found on the sender's identification document.
                        example: '928929832'
                    required:
                    - countryToSend
                    - phoneNumber
                    - valueInUSD
                    - momoCode
              required:
              - momos
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    description: Status of the request.
                    example: success
                  message:
                    type: string
                    description: Message describing the outcome.
                    example: Payout completed successfully
                  data:
                    type: object
                    properties:
                      chimoneys:
                        type: array
                        items:
                          type: object
                      payouts:
                        type: array
                        items:
                          type: object
                      data:
                        type: array
                        items:
                          type: object
                      paymentLink:
                        type: string
                        example: http://localhost:4000/pay/?issueID=63576330-b5f6-4279-9324-80633ce14710_11_1726571303087
                      error:
                        type: string
                        example: none
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'
      operationId: postV024PayoutsMobileMoney
      x-operation-id-source: derived
  /v0.2.4/payouts/interac:
    post:
      summary: Payout Interac
      tags:
      - Payouts
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                subAccount:
                  type: string
                  description: Subaccount (Wallet Account) to payout from, if any.
                  example: '1234567'
                turnOffNotification:
                  type: boolean
                  description: disables email and other notifications from Chimoney.
                  example: 'false'
                debitCurrency:
                  type: string
                  description: Wallet Currency to debit from.
                  example: CAD
                interacs:
                  type: array
                  description: Interac Transactions.
                  items:
                    type: object
                    properties:
                      email:
                        type: string
                        description: Email to send to.
                        example: user@mail.com
                      name:
                        type: string
                        description: Full name of the receiver of the payment
                        example: Jane Doe
                      amount:
                        type: number
                        description: Payout value in CAD. If debitCurrency is not CAD, we do an FX transaction.
                        example: 10
                      narration:
                        type: string
                        description: Narration/Description of payment to be included notification to user
                        example: Monthly Rent Payment
                      collectionPaymentIssueID:
                        type: string
                        description: issue ID for the payment payout initiated.
                        example: '1209992222'
                    required:
                    - email
                    - name
                    - debitCurrency
                    - amount
              required:
              - debitCurrency
              - interacs
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    description: Status of the request.
                    example: success
                  message:
                    type: string
                    description: Message describing the outcome.
                    example: Payout completed successfully
                  data:
                    type: object
                    properties:
                      paymentLink:
                        type: string
                        example: http://localhost:4000/pay/?issueID=63576330-b5f6-4279-9324-80633ce14710_11_1726571303087
                      data:
                        type: array
                        items:
                          type: object
                      chimoneys:
                        type: array
                        items:
