  /v0.2.4/payouts/initiate-chimoney:
    post:
      summary: Initiate Chimoney transaction
      tags:
      - Payouts
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                subAccount:
                  type: string
                  description: Subaccount (Wallet Account) to payout from, if any.
                  example: '1234567'
                turnOffNotification:
                  type: boolean
                  description: disables email and other notifications from Chimoney.
                  example: 'false'
                redirect_url:
                  type: string
                  description: url to redirect to after payment is confirmed
                  example: https://example.com/confirm
                debitCurrency:
                  type: string
                  description: Wallet Currency to debit from.
                  example: CAD
                chimoneys:
                  type: array
                  description: Chimoneys payload.
                  items:
                    type: object
                    properties:
                      email:
                        type: string
                        description: Recipient email address.
                        example: test@gmail.com
                      phone:
                        type: string
                        description: Recipient Phone Number with country code.
                        example: '+16471112222'
                      valueInUSD:
                        type: number
                        description: Value in USD. Defaults to valueInUSD and ignores amount if both set.
                        example: 10
                      amount:
                        type: number
                        description: Amount in debitCurrency to send. debitCurrency is required if set.
                        example: 10
                      twitter:
                        type: string
                        description: Twitter handle.
                        example: '@test'
                      redeemData:
                        type: object
                        properties:
                          walletID:
                            type: string
                            description: Chimoney Wallet ID to deposit the value to.
                            example: XQTUvRBntIU3AHgQ3jFuN9ZcHIC3
                          interledgerWalletAddress:
                            type: string
                            description: Interledger Wallet Address (Payment Pointer) to settle the Payment in. Must be issued by a Chimoney Interledger pair
                            example: https://ilp.chimoney.com/uchi
                          account_bank:
                            type: string
                            description: Bank code.
                            example: '044'
                          account_number:
                            type: string
                            description: Recipient account number.
                            example: 0690000031
                          currency:
                            type: string
                            description: Local currency to payout to.
                            example: NGN
                          branch_code:
                            type: string
                            description: branch_code from /info/bank-branches. Required for all countries except Nigeria
                            example: GH190101
                          fullname:
                            type: string
                            description: fullname of the receiver of the bank payout
                            example: Jane Doe
                enableXUMMPayment:
                  type: boolean
                  description: Generate a Xumm transaction sign link
                  example: 'false'
                enableInterledgerPayment:
                  type: boolean
                  description: Generate an Open Payment payment request to pay with Interledger
                  example: 'false'
                cryptoPayment:
                  type: array
                  description: Crypto payload.
                  items:
                    type: object
                    properties:
                      xrpl:
                        type: object
                        description: XRP object.
                        properties:
                          address:
                            type: string
                            description: Wallet address.
                            example: '0x1234567890'
                          issuer:
                            type: string
                            description: Issuer.
                            example: issuer
                          currency:
                            type: string
                            description: Currency.
                            example: currency
              required:
              - chimoneys
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    description: Status of the request.
                    example: success
                  message:
                    type: string
                    description: Message describing the outcome.
                    example: Payout completed successfully
                  data:
                    type: object
                    properties:
                      paymentLink:
                        type: string
                        example: undefined/pay/?issueID=XQTUvRBntIU3AHgQ3jFuN9ZcHIC3_1_1661120543057
                      error:
                        type: string
                        example: None
                      data:
                        type: array
                        items:
                          type: object
                      cryptoPayment:
                        type: object
                        properties:
                          xrpl:
                            type: object
                          eth:
                            type: object
                          bsc:
                            type: object
                          xummPayment:
                            type: string
                      interledgerPayment:
                        type: object
