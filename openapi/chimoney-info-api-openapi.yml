openapi: 3.2.0
info:
  title: Chimoney API Docs Info API
  version: 0.2.4
  description: This is the latest version of the Chimoney API. For deprecated version routes, please refer to /v0.2/api-docs.
servers:
- url: https://api.chimoney.io/
  description: Prod Server
- url: https://api-v2-sandbox.chimoney.io
  description: Sandbox API v2 (v0.2.4)
security:
- apiKeyAuth: []
tags:
- name: Info
  description: All info related endpoints.
paths:
  /v0.2.4/info/airtime-countries:
    get:
      summary: Get list of all supported airtime Countries
      tags:
      - Info
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    description: Status of the request.
                    example: success
                  message:
                    type: string
                    description: Success message.
                    example: Supported airtime country retrieved successfully
                  data:
                    description: Data returned.
                    type: array
                    items:
                      type: string
                      example:
                      - Nigeria
                      - Ghana
                      - Kenya
                      - South Africa
                      - Uganda
        '400':
          description: Airtime supported countries retrieval failed.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    description: Status of the error.
                    example: error
                  type:
                    type: string
                    description: Type of error.
                    example: Airtime error
                  code:
                    type: string
                    description: Error code.
                    example: AIRTIME_NOT_SUPPORTED
                  message:
                    type: string
                    description: Detailed error message.
                    example: Failed to retrieve airtime supported countries.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'
      operationId: getV024InfoAirtimeCountries
      x-operation-id-source: derived
  /v0.2.4/info/country-states-regions:
    get:
      summary: Get list of states/regions for a specific country
      tags:
      - Info
      parameters:
      - in: query
        name: countryCode
        schema:
          type: string
        description: Two-letter country code (ISO 3166-1 alpha-2).
        required: true
        example: US
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    description: Status of the request.
                    example: success
                  message:
                    type: string
                    description: Success message.
                    example: Country states retrieved successfully
                  data:
                    type: array
                    description: List of regions/states for the country.
                    items:
                      type: object
                      properties:
                        code:
                          type: string
                          description: Region/state code.
                          example: CA
                        name:
                          type: string
                          description: Region/state name.
                          example: California
        '400':
          description: Bad request - Missing or invalid country code.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    description: Status of the error.
                    example: error
                  type:
                    type: string
                    description: Type of error.
                    example: Bank error
                  code:
                    type: string
                    description: Error code.
                    example: BANK_LOOKUP_FAILED
                  message:
                    type: string
                    description: Detailed error message.
                    example: Country code is required
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'
      operationId: getV024InfoCountryStatesRegions
      x-operation-id-source: derived
  /v0.2.4/info/assets:
    get:
      summary: Get list of all assests
      tags:
      - Info
      parameters:
      - in: query
        name: countryCode
        schema:
          type: string
        description: Country code symbol e.g NG, US, GH.
        example: NG
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    description: Status of the request.
                    example: success
                  message:
                    type: string
                    description: Success message.
                    example: Assets retrieved successfully
                  data:
                    type: object
                    properties:
                      benefitsList:
                        type: array
                        description: List of benefits.
                        items:
                          type: object
                          properties:
                            name:
                              type: string
                              example: Save in Chimoney Wallet
                            img:
                              type: string
                              example: https://res.cloudinary.com/africahacks/image/upload/v1606074022/chimoney/Purple-100_z05fgn.jpg
                            description:
                              type: string
                              example: Redeem to your wallet and spend anytime.
                            code:
                              type: string
                              example: airtime
                            type:
                              type: string
                              example: Mobile and Internet
                            available:
                              type: boolean
                              example: true
                      supportedCountriesAirtime:
                        type: array
                        description: List of supported countries for airtime.
                        items:
                          type: string
                          example: Nigeria
                      momoRedeemOptions:
                        type: array
                        items:
                          type: object
                          properties:
                            name:
                              type: string
                              example: Cameroon YUP
                            country:
                              type: string
                              example: Cameroon
                            code:
                              type: string
                              example: YUP
                            provider:
                              type: string
                              example: flw
                            manual:
                              type: boolean
                              example: true
                      acceptedTokens:
                        type: object
                        description: List of accepted tokens.
                        properties:
                          xrpl:
                            type: array
                            items:
                              type: string
                            example:
                            - BTC
                            - ETH
                      giftCardsRLD:
                        type: array
                        description: Gift cards redeemable list.
                        items:
                          type: string
                          example: Amazon Gift Card
                      crytoFacts:
                        type: array
                        description: List of crypto facts.
                        items:
                          type: string
                          example: Bitcoin is the first cryptocurrency.
                      celoWalletAddress:
                        type: string
                        example: '0x123456789abcdef123456789abcdef123456789a'
                      contests:
                        type: array
                        description: List of ongoing contests.
                        items:
                          type: object
                          properties:
                            title:
                              type: string
                              example: Chimoney Giveaway
                            description:
                              type: string
                              example: Enter to win Chimoney credits.
                      fees:
                        type: object
                        properties:
                          virtualCardIssuanceFee:
                            type: object
                            properties:
                              value:
                                type: number
                                example: 3
                              currency:
                                type: string
                                example: USD
                          giftCardIssuanceFee:
                            type: object
                            properties:
                              value:
                                type: number
                                example: 1
                              percent:
                                type: boolean
                                example: true
                          mobileMoneyFee:
                            type: object
                            properties:
                              value:
                                type: number
                                example: 5
                              percent:
                                type: boolean
                                example: true
                      validity:
                        type: object
                        properties:
                          virtualCardValidity:
                            type: object
                            properties:
                              value:
                                type: number
                                example: 30
                              unit:
                                type: string
                                example: days
                      subscriptionPlans:
                        type: array
                        items:
                          type: object
                          properties:
                            planName:
                              type: string
                              example: Gold
                            price:
                              type: number
                              example: 50
                            currency:
                              type: string
                              example: USD
                      giftCardsWG:
                        type: array
                        description: Gift cards for WG.
                        items:
                          type: string
                          example: Apple Gift Card
                      ecommerce:
                        type: array
                        description: E-commerce platforms.
                        items:
                          type: string
                          example: Amazon
                      featuredProducts:
                        type: array
                        description: List of featured products.
                        items:
                          type: object
                          properties:
                            url:
                              type: string
                              example: /Beauty%20&%20Personal%20Care/B014S847QM
                            img:
                              type: string
                              example: https://images.unsplash.com/photo-1661956600655-e772b2b97db4
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'
      operationId: getV024InfoAssets
      x-operation-id-source: derived
  /v0.2.4/info/country-banks:
    get:
      summary: Get list of Supported banks and bank code
      tags:
      - Info
      parameters:
      - in: query
        name: countryCode
        schema:
          type: string
        description: Country code symbol e.g NG, US, GH.
        required: true
        example: NG
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    description: Status of the request.
                    example: success
                  message:
                    type: string
                    description: Success message.
                    example: Supported country banks retrieved successfully.
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: number
                          example: 191
                        code:
                          type: string
                          example: '044'
                        name:
                          type: string
                          example: Access Bank
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          description: Supported Bank list and bankcode retrieval failed.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    description: Status of the error.
                    example: error
                  type:
                    type: string
                    description: Type of error.
                    example: Bank error
                  code:
                    type: string
                    description: Error code.
                    example: BANK_LOOKUP_FAILED
                  message:
                    type: string
                    description: Detailed error message.
                    example: Failed to retrieve supported banks.
      operationId: getV024InfoCountryBanks
      x-operation-id-source: derived
  /v0.2.4/info/bank-branches:
    get:
      summary: Get list of bank branches and branch code
      tags:
      - Info
      parameters:
      - in: query
        name: bankID
        schema:
          type: string
        description: bankCode id from /info/country-banks
        required: true
        example: '280'
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    description: Status of the request.
                    example: success
                  message:
                    type: string
                    description: Message indicating the result of the operation.
                    example: Operation successful
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: number
                          description: Unique identifier for the bank branch.
                          example: 1014
                        branch_code:
                          type: string
                          description: Code of the bank branch.
                          example: GH190603
                        branch_name:
                          type: string
                          description: Name of the bank branch.
                          example: STABIC BANK GHANA LIMITED - ADUM
                        swift_code:
                          type: string
                          description: SWIFT code of the bank branch.
                          example: SBICGHAC
                        bic:
                          type: string
                          description: Bank Identifier Code (BIC) of the branch.
                          example: SBICGHAC
                        bank_id:
                          type: number
                          description: Unique identifier of the bank.
                          example: 280
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          description: Bank branch retrieval failed.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    description: Status of the error.
                    example: error
                  type:
                    type: string
                    description: Type of error.
                    example: Bank error
                  code:
                    type: string
                    description: Error code.
                    example: BANK_LOOKUP_FAILED
                  message:
                    type: string
                    description: Detailed error message.
                    example: Failed to retrieve bank branches
      operationId: getV024InfoBankBranches
      x-operation-id-source: derived
  /v0.2.4/info/bank-search:
    get:
      summary: Search for banks in a specific country (Support for international banks)
      tags:
      - Info
      parameters:
      - in: query
        name: country
        schema:
          type: string
        description: Two-letter country code (ISO 3166-1 alpha-2).
        required: true
        example: US
      - in: query
        name: search
        schema:
          type: string
        description: Search query for bank name (minimum 2 characters).
        required: true
        example: Chase
      - in: query
        name: skip
        schema:
          type: integer
        description: Number of records to skip for pagination.
        required: false
        example: 0
      - in: query
        name: take
        schema:
          type: integer
        description: Number of records to take (page size).
        required: false
        example: 100
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    description: Status of the request.
                    example: success
                  message:
                    type: string
                    description: Success message.
                    example: Banks retrieved successfully
                  data:
                    type: array
                    description: List of banks matching the search criteria.
                    items:
                      type: object
                      properties:
                        primaryKey:
                          type: string
                          description: Unique identifier for the bank
                          example: '000000000371330'
                        institutionName:
                          type: string
                          description: Name of the banking institution
                          example: DISTRICT 58 FEDERAL CREDIT UNION
                        address1:
                          type: string
                          description: Primary address line
                          example: 6217 HWY 15
                        address2:
                          type: string
                          description: Secondary address line
                          example: ''
                        city:
                          type: string
                          description: City location
                          example: CHASE
                        region:
                          type: string
                          description: State or region
                          example: LOUISIANA
                        country:
                          type: string
                          description: Full country name
                          example: UNITED STATES
                        countryISO:
                          type: string
                          description: ISO country code
                          example: US
                        postalCode:
                          type: string
                          description: Postal/ZIP code
                          example: '71324'
                        swiftBIC:
                          type: string
                          description: SWIFT/BIC code if available
                          example: ''
                        nationalBankCode:
                          type: string
                          description: National bank identifier
                          example: '311175158'
                        nationalBankCodeType:
                          type: string
                          description: Type of national bank code
                          example: USBC
                        officeType:
                          type: string
                          description: Type of banking office
                          example: Head Office
                        branchName:
                          type: string
                          description: Branch name if applicable
                          example: ''
                        phone:
                          type: string
                          description: Contact phone number
                          example: ''
                        fax:
                          type: string
                          description: Fax number
                          example: ''
                  pagination:
                    type: object
                    properties:
                      total:
                        type: integer
                        description: Total number of records available
                        example: 1984
                      skip:
                        type: integer
                        description: Number of records skipped
                        example: 0
                      take:
                        type: integer
                        description: Number of records returned
                        example: 100
        '400':
          description: Bad request - Missing or invalid parameters.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    description: Status of the error.
                    example: error
                  type:
                    type: string
                    description: Type of error.
                    example: Bank error
                  code:
                    type: string
                    description: Error code.
                    example: BANK_LOOKUP_FAILED
                  message:
                    type: string
                    description: Detailed error message.
                    example: Country code is required
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'
      operationId: getV024InfoBankSearch
      x-operation-id-source: derived
  /v0.2.4/info/exchange-rates:
    get:
      summary: Get exchange rates
      tags:
      - Info
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    description: Status of the request.
                    example: success
                  message:
                    type: string
                    description: Message indicating the result of the operation.
                    example: Exchange rates retrieved successfully
                  data:
                    type: object
                    properties:
                      USDAED:
                        type: number
                        description: Exchange rate from USD to AED.
                        example: 2.634
                      NGNUSD:
                        type: number
                        description: Exchange rate from NGN to USD.
                        example: 0.0006
                      NGNSTN:
                        type: number
                        description: Exchange rate from NGN to STN.
                        example: 0.0511
                      validUntil:
                        type: string
                        description: Date and time when the exchange rates are valid until (UTC).
                        example: 9/9/2024, 8:00:00 AM UTC
                      expiresAt:
                        type: string
                        description: Expiration date and time for the exchange rates (UTC).
                        example: 9/9/2024, 8:00:00 AM UTC
                      expiresAtTimestamp:
                        type: integer
                        description: Unix timestamp when the exchange rates expire.
                        example: 1725868800000
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          description: Exchange rate retrieval failed.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    description: Status of the error.
                    example: error
                  type:
                    type: string
                    description: Type of error.
                    example: Exchange Rate Error
                  code:
                    type: string
                    description: Error code.
                    example: EXCHANGE_RATE_FETCH_FAILED,
                  message:
                    type: string
                    description: Detailed error message.
                    example: Failed to retrieve exchange rates.
      operationId: getV024InfoExchangeRates
      x-operation-id-source: derived
  /v0.2.4/info/local-amount-in-usd:
    get:
      summary: Convert local currency amount to USD
      tags:
      - Info
      parameters:
      - in: query
        name: originCurrency
        schema:
          type: string
        description: Currency symbol e.g NGN, USD.
        required: true
      - in: query
        name: amountInOriginCurrency
        schema:
          type: integer
        description: amount to be converted.
        required: true
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    description: Status of the request.
                    example: success
                  message:
                    type: string
                    description: Message indicating the result of the operation.
                    example: Amount converted to USD successfully
                  data:
                    type: object
                    properties:
                      amountInOriginCurrency:
                        type: string
                        example: '20'
                      originCurrency:
                        type: string
                        example: NGN
                      amountInUSD:
                        type: number
                        example: 0.2
                      validUntil:
                        type: string
                        example: '2022-08-21T20:05:50.474Z'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'
      operationId: getV024InfoLocalAmountInUsd
      x-operation-id-source: derived
  /v0.2.4/info/convert/local-amount-to-usd:
    get:
      summary: Convert currency amount to USD
      tags:
      - Info
      parameters:
      - in: query
        name: originCurrency
        schema:
          type: string
        description: Currency symbol e.g NGN, USD.
        required: true
      - in: query
        name: amountInOriginCurrency
        schema:
          type: integer
        description: amount to be converted.
        required: true
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    description: Status of the request.
                    example: success
                  message:
                    type: string
                    description: Message indicating the result of the operation.
                    example: Amount converted to USD successfully
                  data:
                    type: object
                    properties:
                      amountInOriginCurrency:
                        type: string
                        example: '20'
                      originCurrency:
                        type: string
                        example: NGN
                      amountInUSD:
                        type: number
                        example: 0.2
                      validUntil:
                        type: string
                        example: '2022-08-21T20:05:50.474Z'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'
      operationId: getV024InfoConvertLocalAmountToUsd
      x-operation-id-source: derived
  /v0.2.4/info/usd-amount-in-local:
    get:
      summary: Convert USD amount to Local currency amount
      tags:
      - Info
      parameters:
      - in: query
        name: destinationCurrency
        schema:
          type: string
        description: currency symbol e.g NGN, KES.
        required: true
      - in: query
        name: amountInUSD
        schema:
          type: integer
        description: amount in usd.
        required: true
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    description: Status of the request.
                    example: success
                  message:
                    type: string
                    description: Message indicating the result of the operation.
                    example: USD converted to local amount successfully
                  data:
                    type: object
                    properties:
                      amountInUSD:
                        type: string
                        example: '100'
                      destinationCurrency:
                        type: string
                        example: NGN
                      amountInDestinationCurrency:
                        type: number
                        example: 1000
                      validUntil:
                        type: string
                        example: '2022-08-21T20:05:50.474Z'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'
      operationId: getV024InfoUsdAmountInLocal
      x-operation-id-source: derived
  /v0.2.4/info/convert/usd-to-local-amount:
    get:
      summary: Convert USD to Local currency amount
      tags:
      - Info
      parameters:
      - in: query
        name: destinationCurrency
        schema:
          type: string
        description: currency symbol e.g NGN, KES.
        required: true
      - in: query
        name: amountInUSD
        schema:
          type: integer
        description: amount in usd.
        required: true
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    description: Status of the request.
                    example: success
                  message:
                    type: string
                    description: Message indicating the result of the operation.
                    example: USD converted to local amount successfully
                  data:
                    type: object
                    properties:
                      amountInUSD:
                        type: string
                        example: '100'
                      destinationCurrency:
                        type: string
                        example: NGN
                      amountInDestinationCurrency:
                        type: number
                        example: 1000
                      validUntil:
                        type: string
                        example: '2022-08-21T20:05:50.474Z'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'
      operationId: getV024InfoConvertUsdToLocalAmount
      x-operation-id-source: derived
  /v0.2.4/info/mobile-money-codes:
    get:
      summary: Get list of all supported mobile money codes
      tags:
      - Info
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    description: Status of the request.
                    example: success
                  message:
                    type: string
                    description: Message indicating the result of the operation.
                    example: Supported mobile money code retrieved successfully
                  data:
                    type: array
                    description: List of supported mobile money codes.
                    items:
                      type: object
                      properties:
                        name:
                          type: string
                          description: Name of the mobile money service.
                          example: Cameroon Mobile Money
                        country:
