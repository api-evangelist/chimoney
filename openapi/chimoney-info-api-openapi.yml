  /v0.2.4/info/fee-estimate:
    post:
      summary: Estimate fees for a transaction before executing it
      description: Returns estimated fees for a given amount and optional rail. When rail is omitted, assumes a standard chimoney payout and currency must be USD.
      tags:
      - Info
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - amount
              properties:
                amount:
                  type: number
                  description: The transaction amount.
                  example: 100
                currency:
                  type: string
                  description: Three-letter currency code (defaults to USD). Must be USD when rail is not specified.
                  example: CAD
                rail:
                  type: string
                  description: The payment rail. Optional — when omitted, assumes a standard chimoney payout.
                  enum:
                  - bank
                  - airtime
                  - mobile-money
                  - interac
                  - spei
                  - wallet
                  - gift-card
                  - chimoney
                  - interledger
                  example: interac
                direction:
                  type: string
                  description: Transaction direction (defaults to payout).
                  enum:
                  - payout
                  - funding
                  example: payout
      responses:
        '200':
          description: Fee estimate retrieved successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  message:
                    type: string
                    example: Fee estimate retrieved successfully
                  data:
                    type: object
                    properties:
                      amount:
                        type: number
                        example: 100
                      currency:
                        type: string
                        example: CAD
                      rail:
                        type: string
                        example: interac
                      direction:
                        type: string
                        example: payout
                      platformFee:
                        type: number
                        description: Chimoney platform fee.
                        example: 2
                      railFee:
                        type: number
                        description: Rail-specific fee (e.g. Interac transfer fee).
                        example: 2.5
                      totalFee:
                        type: number
                        description: Sum of platformFee and railFee.
                        example: 4.5
                      netAmount:
                        type: number
                        description: Amount after deducting totalFee.
                        example: 95.5
                      breakdown:
                        type: object
                        properties:
                          platformFee:
                            type: object
                            properties:
                              amount:
                                type: number
                              description:
                                type: string
                          railFee:
                            type: object
                            properties:
                              amount:
                                type: number
                              description:
                                type: string
                      note:
                        type: string
                        description: Disclaimer that fees are estimates.
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'
      operationId: postV024InfoFeeEstimate
      x-operation-id-source: derived
