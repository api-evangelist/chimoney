aid: chimoney
url: https://raw.githubusercontent.com/api-evangelist/chimoney/refs/heads/main/apis.yml
name: Chimoney
kind: company
description: Chimoney is a developer-first global payouts and disbursement platform with
  deep coverage across Africa and 130+ countries. Its REST API sends money to bank accounts,
  mobile money wallets, airtime, gift cards, Chimoney wallets, and Interledger wallet
  addresses, and manages multicurrency wallets, sub-accounts, redemption, inbound payment
  collection, and reference lookups (supported banks, assets, exchange rates). Authentication
  is an API key passed in the X-API-KEY header, issued self-serve from the Chimoney developer
  dashboard, with a separate sandbox host for testing.
accessModel:
  pricing: freemium
  onboarding: self-serve
  trial: false
  try_now: true
  public: false
